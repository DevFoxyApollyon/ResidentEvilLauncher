# Roda os testes (python -m unittest) a cada push e pull request.
name: Testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
